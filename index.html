<form
  action="https://formsubmit.app/f/5gxrkba6jb"
  method="POST">

  <h2>🎁 Undian Berhadiah</h2>
  <p>
    Isi data berikut untuk mendaftar undian.
    Nama dan nomor WhatsApp akan dikirim ke
    pengelola melalui layanan formulir.
  </p>

  <div>
    <label for="nama">Nama peserta</label>
    <input
      id="nama"
      type="text"
      name="nama"
      maxlength="80"
      required>
  </div>

  <div>
    <label for="wa">Nomor WhatsApp</label>
    <input
      id="wa"
      type="tel"
      name="nomor_whatsapp"
      placeholder="Contoh: 081234567890"
      pattern="[0-9+() -]{9,20}"
      required>
  </div>

  <label>
    <input
      type="checkbox"
      name="persetujuan"
      value="setuju"
      required>
    Saya setuju data pendaftaran saya dikirim
    kepada pengelola untuk keperluan undian.
  </label>

  <button type="submit">Daftar Undian</button>
</form>
