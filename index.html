

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANA Kaget</title>
<style>
body {
  background: #0878e8;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px 15px;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  max-width: 350px;
  margin: auto;
}
a {
  display: block;
  background: #0878e8;
  color: white;
  padding: 16px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}
#hasil {
  display: none;
  margin-top: 20px;
  color: #b42318;
}
</style>
</head>
<body>
<div class="card">
  <h2>🎁 DANA Kaget</h2>
  <p>Kamu mendapatkan kejutan!</p>
  <a href="#" onclick="
    document.getElementById('hasil').style.display='block';
    return false;">
    BUKA HADIAH
  </a>
  <div id="hasil">
    <h3>⚠️ PRANK!!</h3>
    <p>Jangan mudah percaya hadiah dari tautan yang tidak dikenal.</p>
    <p>Jangan pernah memberikan PIN atau OTP.</p>
  </div>
</div>
</body>
</html>
