
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Keamanan Siber</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      text-align: center;
      padding: 50px 15px;
    }
    main {
      background: white;
      max-width: 320px;
      margin: auto;
      padding: 24px;
      border-radius: 15px;
    }
    button {
      padding: 12px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #hasil {
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h2>Demo Keamanan Siber</h2>
    <p>Belajar mengenali phishing dengan aman.</p>
    <button id="mulai">Mulai Simulasi</button>
    <p id="hasil"></p>
  </main>

  <script>
    document.getElementById("mulai").addEventListener("click", function() {
      document.getElementById("hasil").textContent =
        "Simulasi dimulai! Selalu periksa alamat situs dan jangan masukkan password pada link yang tidak dipercaya.";
    });
  </script>
</body>
      </html>
